<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div {
  width: 100px;
  height: 100px;
  background-color: red;
  position: relative;
  animation-name: myAnimation;
  animation-duration: 30s;
}

@keyframes myAnimation {
  0%   {background-color:red; left:0px; top:0px;}
  25%  {background-color:grey; left:200px; top:0px;}
  50%  {background-color:blueviolet; left:200px; top:200px;}
  75%  {background-color:blanchedalmond; left:0px; top:200px;}
  100% {background-color:aquamarine; left:0px; top:0px;}
}
</style>
<body>
    <div></div>
    
</body>
</html>
