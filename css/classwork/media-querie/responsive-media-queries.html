<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            width:100vw;
            height:100vh;
            margin: 25px;
            gap:15px;
            display: grid;
            justify-content: center;
            grid-template-columns: repeat(3, 1fr);}
            .card{
             width: 400px;
                height: 400px;

                border: 1px solid #ccc;
            }
            .card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            @media (max-width: 768px) {
                .grid-container {
                    width: 100%;
                    height: 100vh;
                    margin: 0;
                    padding: 16px;
                    box-sizing: border-box;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 16px;
                }

                .card {
                    width: 100%;
                    height: auto;
                    aspect-ratio: 4 / 5;
                }
            }

            @media (max-width: 600px) {
                .grid-container {
                    grid-template-columns: 1fr;
                }

                .card {
                    max-width: 400px;
                    margin: 0 auto;
                }
            }
    </style>
</head>
<body>
    <div class="grid-container" ;">
       <div class="card">
            <img src="asset/my photo 1 .jpeg">
        </div>
        <div class="card">
            <img src="asset/my photo 2.jpeg">
        </div>
        <div class="card">
            <img src="asset/my photo 3.jpeg">
        </div>
        <div class="card">
            <img src="asset/my photo 4.jpeg">
        </div>
        <div class="card">
            <img src="asset/my photo 5.jpeg">
        </div>
        <div class="card">
            <img src="asset/my photo 6.jpeg">
        </div>
        <div class="card">
            <img src="asset/my photo 7.jpeg">
        </div>
        <div class="card">
            <img src="asset/my photo 8.jpeg">
        </div>
        <div class="card">
            <img src="asset/my photo 9 .jpeg">
        </div>

    </div>
</body>
</html>
