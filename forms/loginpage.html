<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <h3>Please fill in the details below.</h3>

    <form>

        <fieldset>
            <legend>Personal information</legend>

            <label>Full Name:</label>
            <input type="text" name="fullname">
            <br><br>

            <label>Mobile Number:</label>
            <input type="tel" name="mobile" maxlength="10">
            <br><br>

            <label>Email:</label>
            <input type="email" name="email">
            <br><br>

            <label>Password:</label>
            <input type="password" name="password">
            <br><br>

            <label>Age:</label>
            <input type="number" name="age">
            <br><br>

            <label>Gender:</label>

            <input type="radio" name="gender" value="male">
            Male

            <input type="radio" name="gender" value="female">
            Female

        </fieldset>

        <br>

        <label>Date of Birth:</label>
        <input type="date" name="dob">

        <br><br>

        <fieldset>
            <legend>Additional information</legend>

            <label>Interests:</label>

            <input type="checkbox" name="interest" value="coding">
            Coding

            <input type="checkbox" name="interest" value="sports">
            Sports

            <input type="checkbox" name="interest" value="music">
            Music

            <br><br>

            <label>Select Course:</label>

            <select name="course">
                <option>BCA</option>
                <option>B.Tech</option>
                <option>MCA</option>
                <option>MBA</option>
            </select>

        </fieldset>

        <br>

        <label>Upload Resume:</label>
        <input type="file" name="resume">

        <br><br>

        <label>Why do you want to join this course?</label>

        <br>

        <textarea name="reason" rows="6" cols="50"></textarea>

        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
