<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSITION PROPERTY </title>
</head>
<style>
    div {
  width: 400px;
  height: 400px;
  background-color: blue;
  transition: width 8s, height 8s, background-color 8s;
}

div:hover {
  width: 800px;
  height: 200px;
  background-color:red;
}
</style>
<body>
    <div></div>
    
</body>
</html>
