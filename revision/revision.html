<!DOCTYPE html>
<html>

<head>
    <title> Div position </title>
    <style>
        .container {
            width: 500px;
            height: 400px;
            border: 3px solid black;
            border-radius: 18px;
            position: relative;
            background-color: blue;


        }

        .div1 {
            width: 500px;
            height: 400px;
            display: flex;
            justify-content: flex-end;
            background-color: skyblue;
            position: absolute;
            border-radius: 18px;
            top: 0;
            right: 0;
        }

        .div2 {
            width: 200px;
            height: 200px;
            background-color: green;
            border-radius: 18px;
            display: flex;
            justify-content: flex-end;
            position: absolute;
            padding: 8px;

            bottom: 0;
            left: 0;

        }
    </style>
</head>

<body>

    <div class="container">
        <div class="div1" text>Div 1</div>
        <div class="div2">Div 2</div>
    </div>

</body>

</html>
