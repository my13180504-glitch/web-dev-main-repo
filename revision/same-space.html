<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox</title>
  <style>
  .container {
    width: 500px;
    height: 400px;
    border: 2px solid black;
    display: flex;
    gap: 50px;
    padding: 50px;
    box-sizing: border-box;
  }

  .box {
    width: 100px;
    height: 60px;
    border: 2px solid blue;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
  </div>
</body>
</html>
