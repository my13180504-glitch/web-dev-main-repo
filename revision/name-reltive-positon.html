<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 2</title>
  <style>
    .box {
      width: 500px;
      height: 400px;
      position: relative;
      border: 2px solid black;
      border-radius: 8px;
    }

    .name {
      position: absolute;
      font-weight: bold;
    }

    .top-left {
      top: 12px;
      left: 18px;
    }

    .top-right {
      top: 12px;
      right: 18px;
    }

    .bottom-left {
      bottom: 12px;
      left: 18px;
    }

    .bottom-right {
      bottom: 12px;
      right: 18px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="name top-left">Mohit</div>
    <div class="name top-right">Mohit</div>
    <div class="name bottom-left">Mohit</div>
    <div class="name bottom-right">Mohit</div>
  </div>
</body>
</html>
