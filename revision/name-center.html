<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>REVISION QUESTION </title>
  <style>
    .box {
      width: 600px;
      height: 400px;
      position: relative;
      border: 3px solid navajowhite;
      background-color: aquamarine;
      border-radius: 15px;
    }
    .name {
      position: absolute;
      font-weight: bold;
    }

    .top {
        background-color: aqua;
        font-size: large;
      top: 0;
      left: 300px;
    }

    .bottom {
         background-color: aqua;
        font-size: large;
      bottom: 0;
      left: 300px;
    }

    .left {
         background-color: aqua;
       font-size: large;
      left: 0;
      top: 200px;
    }

    .right {
         background-color: aqua;
        font-size: large;
      right: 0;
      top: 200px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="name top">Mohit</div>
    <div class="name bottom">Mohit </div>
    <div class="name left">Mohit</div>
    <div class="name right">Mohit</div>
  </div>
</body>
</html>
